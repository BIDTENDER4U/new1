              "@type": "Answer",

            }
          },

            "@type": "Question",
            "name": "How do DPIIT recognized Startups qualify for Prior Turnover and Experience exemptions under GFR 173(i)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Under Rule 173(i) of General Financial Rules (GFR) 2017 and Ministry of Finance Department of Expenditure notifications, all central ministries, CPSEs, and GeM buyers are statutorily mandated to relax prior turnover and prior experience criteria for DPIIT-recognized Startups, provided their goods and services conform to required technical quality benchmarks."
            }
          },

            "acceptedAnswer": {

            }
          },
          {
            "@type": "Question",
            "name": "Can you issue Class-3 Combo DSC USB tokens for e-tendering online?",

            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Statutory registration requires Entity PAN, Aadhaar e-KYC of the authorized signatory, active GSTIN REG-06, PFMS validated bank account, cancelled cheque, Udyam MSME certificate, DPIIT Startup registration (if applicable), Class-3 Combo DSC token, and caution money deposit on GeM 4.0."
