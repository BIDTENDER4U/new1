<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="logoNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D3557" />
      <stop offset="100%" stop-color="#0E1D33" />
    </linearGradient>
  </defs>

  <!-- Mark Area -->
  <g transform="translate(100, 15) scale(0.8)">
    <circle cx="250" cy="250" r="225" fill="none" stroke="url(#logoGold)" stroke-width="22" />
    <circle cx="250" cy="25" r="16" fill="url(#logoGold)" />
    <circle cx="250" cy="25" r="6" fill="#FFFFFF" opacity="0.8" />
    <circle cx="250" cy="250" r="195" fill="url(#logoNavy)" stroke="#D4AF70" stroke-width="2.5" stroke-opacity="0.5" />

    <!-- 100% Unobstructed B and 4 Monogram Letters -->
    <g fill="url(#logoGold)">
      <!-- B -->
      <path d="M 125 130 H 205 C 235 130, 254 146, 254 172 C 254 190, 243 203, 227 210 C 247 218, 260 234, 260 258 C 260 290, 233 308, 196 308 H 125 Z M 165 164 V 203 H 198 C 212 203, 220 195, 220 184 C 220 172, 212 164, 198 164 Z M 165 235 V 275 H 198 C 214 275, 224 266, 224 255 C 224 243, 214 235, 198 235 Z" />
      <!-- 4 -->
      <path d="M 312 130 H 350 V 238 H 378 V 272 H 350 V 308 H 312 V 272 H 250 V 238 L 312 130 Z M 285 238 H 312 V 186 L 285 238 Z" />
    </g>
    <!-- Verified Checkmark Below (Never cuts through letters) -->
    <path d="M 160 350 L 220 388 L 340 330" fill="none" stroke="url(#logoGold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- "BIDTENDER 4U" text with Deep Navy #1D3557 for Maximum Visibility -->
  <text x="300" y="500" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="3" text-anchor="middle" fill="#1D3557">
    BIDTENDER <tspan fill="#D97706">4U</tspan>
  </text>

  <!-- Divider Bar -->
  <rect x="70" y="535" width="460" height="6" rx="3" fill="url(#logoGold)" />

  <!-- Subtitle with Crisp Dark Slate -->
  <text x="300" y="580" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="5" text-anchor="middle" fill="#334155">
    ALL INDIA TENDER CONSULTANCY
  </text>
</svg>
